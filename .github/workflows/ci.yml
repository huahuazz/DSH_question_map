name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 与本地 `node scripts/ci.mjs` 完全同源：语法 → 冒烟 → 流程 → 发布面 → 组合链 → 宿主半边
      - name: 全部检查（本地同名脚本 node scripts/ci.mjs）
        run: node scripts/ci.mjs
